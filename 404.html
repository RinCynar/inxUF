<script>
	var path = window.location.pathname;
	var aboutRedirects = {
		'/2100/10/01/About-InstallerX': '/about/installerx/',
		'/2100/10/01/About-InstallerX/': '/about/installerx/',
		'/2100/10/01/About-Dhizuku': '/about/dhizuku/',
		'/2100/10/01/About-Dhizuku/': '/about/dhizuku/',
		'/2100/10/01/About-Dhizuku-API': '/about/dhizuku-api/',
		'/2100/10/01/About-Dhizuku-API/': '/about/dhizuku-api/'
	};
	if (aboutRedirects[path]) {
		window.location.replace(aboutRedirects[path]);
	} else if (path.includes('InstallerX-wxxsfxyzm') || path.includes('InstallerX_Locker-wxxsfxyzm')) {
		var newPath = path
			.replace(/InstallerX-wxxsfxyzm([0-9])/g, 'InstallerX-Revived-$1')
			.replace(/InstallerX_Locker-wxxsfxyzm([0-9])/g, 'InstallerX_Locker-Revived-$1')
			.replace(/InstallerX-wxxsfxyzm/g, 'InstallerX-Revived')
			.replace(/InstallerX_Locker-wxxsfxyzm/g, 'InstallerX_Locker-Revived');
		window.location.replace(newPath);
	}
</script>

<section class="error-page">
    <p class="error-page__code">404</p>
    <h1 class="error-page__title">Page not found</h1>
    <p class="error-page__text">这个地址不存在，或已经搬家。</p>
    <div class="pager">
        <a href="{{ site.baseurl }}/" class="md-button md-button--filled">Back Home</a>
        <a href="{{ site.baseurl }}/archive/" class="md-button md-button--tonal">View Archive</a>
    </div>
</section>
