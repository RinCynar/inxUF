---
layout: default
---

<article class="page-content">
    <header class="page-header">
        <h1 class="page-header__title">{{ page.title }}</h1>
        {% if page.description %}
        <p class="page-header__subtitle">{{ page.description }}</p>
        {% endif %}
    </header>

    <div class="typography-body">
        {{ content }}
    </div>
</article>
