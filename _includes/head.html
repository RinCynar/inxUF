<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta
    name="google-site-verification"
    content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI"
  />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="description" content="{{ site.description }}" />
  <meta name="keywords" content="{{ site.keyword }}" />
  <meta name="theme-color" id="theme-color-meta" content="#fffbfe" />

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}"
  />
  {% case page.layout %} {% when 'post' %}
  <meta property="og:type" content="article" />
  <meta
    property="og:description"
    content="{{ page.excerpt | strip_html | truncate:200 }}"
  />
  {% if page.date %} <meta property="article:published_time" content="{{
  page.date | date: " %Y-%m-%dT%H:%M:%SZ" }}"> {% endif %} {% if page.author %}
  <meta property="article:author" content="{{ page.author }}" />
  {% endif %} {% for tag in page.tags %}
  <meta property="article:tag" content="{{ tag }}" />
  {% endfor %} {% else %}
  <meta property="og:type" content="website" />
  <meta
    property="og:description"
    content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"
  />
  {% endcase %}
  <meta property="og:image" content="{{ site.url }}{{ site.sidebar-avatar }}" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta property="og:site_name" content="{{ site.SEOTitle }}" />

  <title>
    {% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{
    site.SEOTitle }}{% endif %}
  </title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json" />

  <!-- Favicon -->
  <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.SEOTitle }}" href="{{ "/feed.xml" | prepend: site.baseurl }}" />

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}"
  />

  <!-- Material Design 3 CSS -->
  <link rel="stylesheet" href="{{ "/css/variables.css" | prepend: site.baseurl
  }}"> <link rel="stylesheet" href="{{ "/css/layout.css" | prepend: site.baseurl
  }}"> <link rel="stylesheet" href="{{ "/css/components.css" | prepend:
  site.baseurl }}">

  <!-- Latin UI font is optional so CJK system fonts do not swap after first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=optional"
    rel="stylesheet"
  />

  <!-- Theme Toggle Script (loads before DOM to prevent flash) -->
  <script>
    // Prevent theme flash by applying theme before page renders
    (function () {
      var pref = null;
      try { pref = localStorage.getItem("inxUF_theme"); } catch (e) {}
      var theme;
      if (pref === "dark" || pref === "light") {
        theme = pref;
      } else {
        theme =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      }
      var html = document.documentElement;
      html.classList.add("theme-" + theme);
      html.setAttribute("data-theme", theme);
      html.style.colorScheme = theme;
      var themeColor = theme === "dark" ? "#1c1b1f" : "#fffbfe";
      var themeMeta = document.getElementById("theme-color-meta");
      if (themeMeta) themeMeta.setAttribute("content", themeColor);
    })();
  </script>

  <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
  <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
  <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
    <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
  <![endif]-->

  <!-- Google AdSense -->
  <script
    data-ad-client="ca-pub-6487568398225121"
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
  ></script>
</head>
