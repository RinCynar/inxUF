<!-- Material You Footer -->
<footer class="footer">
    <div class="footer__content">
        {% include sns-links.html center=true %}
        
        <p class="copyright" style="margin-top: 16px; opacity: 0.7; font-size: 0.875rem;">
            Copyright &copy; {{ site.title }} {{ site.time | date: '%Y' }}
            <br>
            Powered by <a href="http://github.com/RinCynar/inxUF" style="color: inherit;">GitHub</a>
        </p>
    </div>
</footer>

<!-- Simple Jekyll Search (Vanilla JS replacement for jQuery parts if needed, but keeping library import) -->
<script src="{{ "/js/simple-jekyll-search.min.js" | prepend: site.baseurl }}"></script>

<!-- Service Worker -->
{% if site.service-worker %}
<script src="{{ "/js/snackbar.js " | prepend: site.baseurl }}"></script>
<script src="{{ "/js/sw-registration.js " | prepend: site.baseurl }}"></script>
{% endif %}
